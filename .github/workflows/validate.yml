name: Repository validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install uv
        run: python -m pip install uv==0.11.20
      - name: Validate repository and maintenance tools
        run: |
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python scripts/validate_repo.py
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python -m unittest discover -s tests
          python scripts/quantitative_examples.py
      - name: Validate ontology semantics
        run: uv run --python 3.12 --no-project domains/ontology-modeling/skills/ontology-modeling/scripts/verify_example.py
      - name: Build and verify portable directories
        run: |
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python scripts/bundle_skills.py --bundle repository --output .tmp/bundles/repository
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python scripts/bundle_skills.py --bundle ontology-modeling --output .tmp/bundles/ontology-modeling
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python scripts/bundle_skills.py --verify .tmp/bundles/repository
      - name: Run from portable directories
        run: |
          cd .tmp/bundles/repository
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python scripts/validate_repo.py
          uv run --python 3.12 --no-project --with pyyaml==6.0.3 python -m unittest discover -s tests
          python scripts/quantitative_examples.py
          cd ../ontology-modeling
          uv run --python 3.12 --no-project scripts/verify_example.py
